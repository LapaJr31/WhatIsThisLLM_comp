[project]
name = "name-that-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lapka", email = "jarlat04@lapuas.xyz" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "mlflow>=3.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=25.0.0,<26",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "transformers>=5.20.2",
]

[project.scripts]
name-that-llm = "name_that_llm:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
cpu = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]
cu130 = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

cache-dir = "/tmp/uv-cache"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
prerelease = "allow"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
]

[tool.uv.workspace]
exclude = ["gpu_envs/*"]
